<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — BHB Family Support and Development Foundation</title>
  <link rel="icon" type="image/png" href="assets/images/bhb-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: centre; align-items: centre; background: #0A1220; color: #FFFFFF; text-align: centre; padding: 24px; margin: 0;">
  <div style="">
    <a href="index.html">
      <img src="assets/images/bhb-logo.png" alt="BHB Foundation" style="height: 64px; margin-bottom: 32px;">
    </a>
    <div style="font-size: 5.5rem; font-weight: 800; font-family: var(--font-heading); color: #1C4DA0; line-height: 1; margin-bottom: 16px;">404</div>
    <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 16px; color: #FFFFFF;">Page Not Found</h1>
    <p style="font-size: 1.05rem; color: #94A3B8; line-height: 1.6; margin-bottom: 32px;">
      The page you are looking for may have moved, been renamed, or is temporarily unavailable.
    </p>
    <div style="display: flex; gap: 14px; justify-content: centre; flex-wrap: wrap;">
      <a href="index.html" class="btn btn-primary" style="padding: 12px 28px; font-weight: 700;">Return to Homepage →</a>
      <a href="contact.html" class="btn btn-outline-white" style="padding: 12px 24px;">Contact Support</a>
    </div>
  </div>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Auto-add AOS to major cards
      const elements = document.querySelectorAll('.focus-area-item, .project-card, .news-card, .sdg-card, .commitment-card, .mv-card, .executive-spotlight-card, .team-member-card');
      elements.forEach(el => {
        if (!el.hasAttribute('data-aos')) {
          el.setAttribute('data-aos', 'fade-up');
        }
      });
      if (typeof AOS !== 'undefined') {
        AOS.init({ once: true, offset: 30, duration: 700, easing: 'ease-out-cubic' });
      }
    });
  </script>
</body>
</html>
